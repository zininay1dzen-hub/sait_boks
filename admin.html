<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Секция бокса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-line"></span>
                <span class="logo-text">СЕКЦИЯ<br>БОКСА</span>
            </a>
            <div class="header-center">УПРАВЛЕНИЕ КЛУБОМ</div>
            <div class="header-right">
                <button type="button" class="header-button" id="logoutButton">Выйти</button>
            </div>
        </div>
    </header>

    <main class="page-main admin-main">
        <div class="container">
            <div class="red-label">УПРАВЛЕНИЕ КЛУБОМ</div>
            <h1 class="admin-title">Панель администратора</h1>

            <h2 class="block-title">01 / Добавить тренировку</h2>
            <form id="addForm" class="add-form">
                <div class="field">
                    <label for="addDay">День</label>
                    <select id="addDay"></select>
                </div>
                <div class="field">
                    <label for="addTime">Время</label>
                    <input type="text" id="addTime" placeholder="19:00 – 20:30">
                </div>
                <div class="field">
                    <label for="addGroup">Группа</label>
                    <select id="addGroup"></select>
                </div>
                <div class="field">
                    <label for="addCoach">Тренер</label>
                    <select id="addCoach" disabled title="Тренер определяется выбранной группой"></select>
                </div>
                <button type="submit" class="button add-button">Добавить</button>
            </form>
            <p id="addMessage" class="message"></p>

            <h2 class="block-title block-title-next">02 / Управление расписанием</h2>
            <div class="table-wrap">
                <table class="table table-admin-schedule">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Время</th>
                            <th>Группа</th>
                            <th>Тренер</th>
                            <th class="th-action">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="trainingsBody"></tbody>
                </table>
            </div>

            <h2 class="block-title block-title-next">03 / Записи клиентов</h2>
            <div class="search-box">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#888" stroke-width="1.5"><circle cx="7" cy="7" r="5.2"></circle><line x1="11" y1="11" x2="14.5" y2="14.5"></line></svg>
                <input type="text" id="bookingSearch" placeholder="Поиск по имени или группе">
            </div>
            <div class="table-wrap">
                <table class="table table-admin-bookings">
                    <thead>
                        <tr>
                            <th>Имя клиента</th>
                            <th>Телефон</th>
                            <th>Группа</th>
                            <th>Тренировка</th>
                            <th class="th-action">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-name">СЕКЦИЯ БОКСА</div>
            <div class="footer-address">Александров, ул. Спортивная, 12</div>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
