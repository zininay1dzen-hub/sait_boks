<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Секция бокса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-line"></span>
                <span class="logo-text">СЕКЦИЯ<br>БОКСА</span>
            </a>
            <div class="header-center header-center-light" id="headerUser"></div>
            <div class="header-right">
                <button type="button" class="header-button" id="logoutButton">Выйти</button>
            </div>
        </div>
    </header>

    <main class="page-main">
        <div class="container">
            <div class="red-label">ЛИЧНЫЙ КАБИНЕТ</div>
            <h1 class="cabinet-name" id="userName"></h1>
            <p class="cabinet-group" id="userGroup"></p>
            <p class="cabinet-text">Ваши тренировки, ваш прогресс. Увидимся на ринге.</p>

            <div class="title-row">
                <h2 class="block-title">Мои записи</h2>
                <span class="count" id="bookingCount"></span>
            </div>

            <div class="table-wrap">
                <table class="table table-cabinet">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Время</th>
                            <th>Тренер</th>
                        </tr>
                    </thead>
                    <tbody id="myBookings"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-name">СЕКЦИЯ БОКСА</div>
            <div class="footer-address">Александров, ул. Спортивная, 12</div>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
